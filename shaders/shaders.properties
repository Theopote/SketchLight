# =========================================================
# SketchLight — Iris Shader Pack
# shaders.properties
# =========================================================
# This file configures buffers, in-game options, and pack
# metadata that Iris reads. Extend the [OPTIONS] section as
# you add more tunable effects.

# ---- Custom render targets --------------------------------
# colortex0 = default albedo/scene color (always exists)
# colortex1 = view-space normal buffer, written during the
#             gbuffers_* passes and consumed by composite.fsh
#             for edge detection.
colortex1Format=RGBA16F
colortex1Clear=true

# ---- In-game shader options ---------------------------------
# These show up in Iris' shader options screen (press the
# wrench icon). Sliders/booleans referenced here must be
# declared as #define in the relevant .fsh files.
sliderOptions=OUTLINE_STRENGTH CEL_STEPS PAPER_GRAIN_STRENGTH
booleanOptions=SHOW_NORMAL_EDGES

screen=<empty>
screen.[SHADER]=OUTLINE_STRENGTH CEL_STEPS
screen.columns=1

# ---- Metadata -------------------------------------------------
# Iris doesn't require a version tag here, but keeping one is
# good practice once you start branching profiles per MC version.
